
# CD: migrate -> deploy exact image -> smoke test

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (rollback). Migrations are skipped."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.LIVE_URL }}

    env:
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run migrations on Neon
        if: github.event_name == 'workflow_run'
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL is missing"
            exit 1
          fi

          uv run alembic upgrade head

      - name: Deploy exact image to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: Render deploy hook is missing"
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${SHA}"

          echo "Deploying image: $IMAGE"

          curl --fail --silent --show-error \
            --get \
            --data-urlencode "imgURL=$IMAGE" \
            "$RENDER_DEPLOY_HOOK"

      - name: Smoke test live deployment
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "ERROR: LIVE_URL is missing"
            exit 1
          fi

          uv run python scripts/smoke.py "$LIVE_URL" \
            --expect-version "$SHA"
